apiVersion: apps/v1
kind: Deployment
metadata:
  name: voting-service
  labels:
    app: voting-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voting-service
  template:
    metadata:
      labels:
        app: voting-service
    spec:
      containers:
        - name: voting-service
          image: udarawick/voting-service:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: voting-service-config