version: '3.8'

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  voting-service:
    build:
      context: ./voting-service
      dockerfile: Dockerfile
    environment:
      - REDIS_CONNECTION=redis:6379
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5000:5000"
    depends_on:
      - redis
    restart: unless-stopped

  voting-result:
    build:
      context: ./voting-result
      dockerfile: Dockerfile
    environment:
      - REDIS_CONNECTION=redis://redis:6379
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - redis
    restart: unless-stopped

  voting-client:
    build:
      context: ./voting-client
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - voting-result
    restart: unless-stopped

volumes:
  redis-data:
